server {
    listen 443 ssl;
    server_name demo.ltzm.ccwu.cc;
    ssl_certificate /etc/letsencrypt/live/demo.ltzm.ccwu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.ltzm.ccwu.cc/privkey.pem;
    client_max_body_size 0;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name demo.ltzm.ccwu.cc;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name agiso.ltzm.me;
    ssl_certificate /etc/letsencrypt/live/agiso.ltzm.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agiso.ltzm.me/privkey.pem;
    client_max_body_size 8k;
    location ~ ^/(auth|issue|revoke)$ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
